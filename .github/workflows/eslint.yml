name: ESLint

on:
    push:
        branches: ["*"]
    pull_request:
        branches: ["main"]

jobs:
    eslint:
        name: Run eslint scanning
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run ESLint
              run: eslint . --ext .js,.jsx,.ts,.tsx
