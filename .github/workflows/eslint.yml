name: ESLint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]
  merge_group:
    branches: ["main"]

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Cache node modules

        uses: actions/cache@v3
        with:
          path: buffet-app/node_modules
          key: npm-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: |
          cd buffet-app
          npm ci

      - name: Run npm package audit
        run: |
          cd buffet-app
          npm audit
      - name: Run lint
        run: |
          cd buffet-app
          npm run lint
