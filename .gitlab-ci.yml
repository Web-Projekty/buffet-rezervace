stages:
    - PHP Unit Tests

phpunit:
    stage: PHP Unit Tests
    image: wlczak/buffet-test-prebuild:latest
    
    script:
        - cd buffet-api
        - composer install
        - ./vendor/bin/phpunit tests --testdox --colors=always --coverage-text
        - ./vendor/bin/phpunit tests --testdox --colors=never --coverage-text | grep 'Lines:'
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
