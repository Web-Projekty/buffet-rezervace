stages:
  - PHP Unit Tests

phpunit:
  stage: Tests
  image: php:8.3
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev libonig-dev
    - docker-php-ext-install mysqli
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd buffet-api
    - composer install
  script:
    - ./vendor/bin/phpunit tests --testdox --colors=always
