stages:
    - PHP Unit Tests

phpunit:
    stage: PHP Unit Tests
    image: wlczak/buffet-test-prebuild:latest
    
    script:
        - cd buffet-api
        - composer install
        - ./vendor/bin/phpunit tests --testdox --colors=always --coverage-text --coverage-clover=coverage.xml
    artifacts:
        paths:
        - buffet-api/coverage.xml
    coverage: '/<coverage>(\d+.\d+)<\/coverage>/'
