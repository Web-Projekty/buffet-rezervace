stages:
    - PHP Unit Tests

phpunit:
    stage: PHP Unit Tests
    image: wlczak/buffet-test-prebuild:latest
    
    script:
        - cd buffet-api
        - composer install
        - ./vendor/bin/phpunit tests --testdox --colors=never --coverage-text --coverage-clover=coverage.xml
    artifacts:
        paths:
        - buffet-api/coverage.xml
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
