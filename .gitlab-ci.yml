stages:
    - PHP Unit Tests
    - PHP Static Analysis

# Job to run PHPStan
phpstan-analysis:
    stage: PHP Static Analysis
    image: wlczak/buffet-test-prebuild:latest
    script:
        - cd buffet-api
        - composer install
        - ./vendor/bin/phpstan analyse -c phpstan.neon --autoload-file vendor/autoload.php --error-format=gitlab src
          tests >> phpstan-result.json
    artifacts:
        reports:
            codequality: buffet-api/phpstan-result.json

# Job to run PHPUnit tests and generate the coverage output
phpunit:
    stage: PHP Unit Tests
    image: wlczak/buffet-test-prebuild:latest
    script:
        - cd buffet-api
        - composer install
        - cp -r conf/ buffet-api/
        - chown -R 1000:1000 /var/www/html/conf
        - ./vendor/bin/phpunit tests --testdox --colors=always --coverage-text --coverage-html tests/result
          --display-deprecations --display-phpunit-deprecations --fail-on-deprecation
          --fail-on-phpunit-deprecation
    artifacts:
        paths:
            - buffet-api/tests/result/
        expire_in: 1 hour

# Job to extract the coverage percentage from the PHPUnit output
phpunit-coverage:
    stage: PHP Unit Tests
    image: wlczak/buffet-test-prebuild:latest
    script:
        - cd buffet-api
        - composer install
        - ./vendor/bin/phpunit tests --testdox --colors=never --coverage-text
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
