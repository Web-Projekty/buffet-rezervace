<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-08ZFSSMWG7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag("js", new Date());

        gtag("config", "G-08ZFSSMWG7");
    </script>

    <title>Image Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .upload-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input[type="file"] {
            margin: 10px 0;
            display: block;
            width: 100%;
            padding: 8px;
        }
    </style>
</head>

<body>
    <div class="upload-container">
        <h2>Upload an Image</h2>
        <form action="api" method="post" enctype="multipart/form-data" id="uploadForm">
            <input type="text" name="requestType" value="uploadImage" hidden>
            <input type="text" name="token" id="tokenField" placeholder="Loading token..." required>
            <input type="number" name="imageId">
            <select name="directory">
                <option value="items">Item</option>
                <option value="categories">Category</option>
                <option value="variants">Variants</option>
                <option value="invalid-dir">Invalid option</option>
            </select>
            <input type="file" name="image" accept="image/*" required>
            <br>
            <button type="submit">Upload</button>
        </form>
        <button onclick="sendFile()">Send via Fetch</button>
    </div>
    <script>
        function fetchToken() {
            fetch('api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requestType: "login", username: "admin", password: "admin" })
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('tokenField').value = data.payload.token || 'Failed to fetch token';
                })
                .catch(error => {
                    console.error('Error fetching token:', error);
                    document.getElementById('tokenField').value = 'Error fetching token';
                });
        }

        function sendFile() {
            const formData = new FormData(document.getElementById('uploadForm'));
            fetch('api', {
                method: 'POST',
                body: formData
            })
                .then(response => response.text())
                .then(data => {
                    console.log('File uploaded successfully: ' + data)
                    gtag("event", "upload_image", { "event_category": "image_upload", "status": JSON.parse(data).status });
                })
                .catch(error => console.log('Error uploading file: ' + error));
        }

        window.onload = fetchToken;
    </script>
</body>

</html>
