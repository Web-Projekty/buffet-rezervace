<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .upload-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        input[type="file"] {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h2>Upload an Image</h2>
        <form action="api/upload" method="post" enctype="multipart/form-data" id="uploadForm">
            <input type="file" name="image" accept="image/*" required>
            <br>
            <button type="submit">Upload</button>
        </form>
        <button onclick="sendFile()">Send via Fetch</button>
    </div>
    <script>
        function sendFile() {
            const formData = new FormData(document.getElementById('uploadForm'));
            fetch('api/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => alert('File uploaded successfully: ' + data))
            .catch(error => alert('Error uploading file: ' + error));
        }
    </script>
</body>
</html>
